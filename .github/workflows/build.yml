# Builds Sprout, its examples and tests on Windows, macOS and Linux, runs the
# unit tests everywhere, and runs every game for 2 seconds on Linux.
# Only when started by hand: GitHub > Actions > Build > Run workflow.
name: Build

on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev xvfb

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSPROUT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      # Builds and loads the demo project's C++ scripts library (hot reloading)
      # without opening a window, so the DLL linking is tested on every OS.
      - name: Check the editor's scripts load
        shell: bash
        run: |
          exe=build/bin/sprout_editor/sprout_editor
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          "$exe" --check-scripts

      # The Script tab's live checking (clangd, downloaded by the build): a good
      # script has no errors, and a broken one is caught.
      - name: Check live script checking
        shell: bash
        run: |
          exe=build/bin/sprout_editor/sprout_editor
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          "$exe" --check-file editor/project/scripts/player_controller.cpp
          sed 's/float gravity = 1400;/float gravity = undefinedThing;/' editor/project/scripts/player_controller.cpp \
            > editor/project/scripts/broken_check.cpp
          if "$exe" --check-file editor/project/scripts/broken_check.cpp; then
            echo "::error::the broken script wasn't caught"; exit 1
          fi
          rm editor/project/scripts/broken_check.cpp

      # Signals: every way of connecting and sending them (no window)
      - name: Test signals
        shell: bash
        run: |
          exe=build/bin/sprout_editor/sprout_editor
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          SPROUT_EDITOR="$PWD/$exe" scripts/test-signals.sh

      # The Script tab's extra checks (findNode before ready()...)
      - name: Test script checks
        shell: bash
        run: |
          exe=build/bin/sprout_editor/sprout_editor
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          SPROUT_EDITOR="$PWD/$exe" scripts/test-lint.sh

      # Multiplayer for real: a dedicated server and two clients (separate
      # programs, no windows) connect, call RPCs, sync nodes, spawn and leave.
      - name: Test multiplayer
        shell: bash
        run: |
          exe=build/bin/sprout_editor/sprout_editor
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          SPROUT_EDITOR="$PWD/$exe" scripts/test-multiplayer.sh
          # again over a slow, lossy network (prediction, interpolation, lag compensation)
          SPROUT_EDITOR="$PWD/$exe" SPROUT_TEST_LAG="--lag 120 --jitter 20 --loss 5" SPROUT_TEST_PORT=7791 \
            scripts/test-multiplayer.sh

      # Exports the editor's demo game for this runner's own platform, the way
      # the editor's Export window does, and plays the Linux one for 2 seconds.
      - name: Export the editor's demo game
        shell: bash
        run: |
          exe=build/bin/sprout_editor/sprout_editor
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          case "$RUNNER_OS" in
            Linux) target=linux ;;
            Windows) target=windows ;;
            macOS) target=macos ;;
          esac
          "$exe" --export "$target"

      # A portable copy of the editor (scripts/make-portable), used with the
      # build folder and the editor's sources out of the way: it must find
      # everything in its own folder.
      - name: Test a portable editor
        shell: bash
        run: |
          out="$RUNNER_TEMP/SproutEditor"
          cmake --install build --config Release --component sprout_editor --prefix "$out"
          exe="$out/sprout_editor"
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          cp -r editor/templates/multiplayer "$RUNNER_TEMP/portable_test"
          mv build build-hidden && mv editor editor-hidden
          trap 'mv build-hidden build; mv editor-hidden editor' EXIT
          case "$RUNNER_OS" in
            Linux) target=linux ;;
            Windows) target=windows ;;
            macOS) target=macos ;;
          esac
          "$exe" --project "$RUNNER_TEMP/portable_test" --check-scripts
          "$exe" --project "$RUNNER_TEMP/portable_test" --check-file "$RUNNER_TEMP/portable_test/scripts/lobby.cpp"
          "$exe" --project "$RUNNER_TEMP/portable_test" --export "$target" "$RUNNER_TEMP/portable_export"

      - name: Run the exported game
        if: runner.os == 'Linux'
        run: SPROUT_TEST_FRAMES=120 timeout 60 xvfb-run -a editor/project/exports/linux/Sprout_Game

      # GitHub's Mac runners have no GPU, so raylib can't open a window there and
      # the app isn't played. Instead its contents are checked and it's uploaded,
      # zipped, to try on a real Mac.
      - name: Check the exported macOS app
        if: runner.os == 'macOS'
        run: |
          app=editor/exports/macos/Sprout_Game.app
          test -f "$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/Sprout_Game"
          test -f "$app/Contents/Resources/project/project.json"
          codesign --verify --deep --strict --verbose=2 "$app"
          # A universal app: native on Apple Silicon and Intel Macs
          archs=$(lipo -archs "$app/Contents/MacOS/Sprout_Game")
          echo "Architectures: $archs"
          case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::not universal: $archs"; exit 1 ;; esac
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Sprout_Game-macOS.zip"

      - name: Upload the exported macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Sprout_Game-macOS
          path: ${{ runner.temp }}/Sprout_Game-macOS.zip

      - name: Run every game and example for 2 seconds
        if: runner.os == 'Linux'
        run: |
          status=0
          for dir in build/bin/*/; do
            name=$(basename "$dir")
            echo "::group::$name"
            if SPROUT_TEST_FRAMES=120 timeout 60 xvfb-run -a "$dir$name"; then
              echo "$name ran OK"
            else
              echo "::error::$name failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
